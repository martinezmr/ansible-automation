- name: CustomModule
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: executes custom module
      hello: 
        name: "Alexandra" 
      register: demo_greeting
    - name: dump output
      ansible.builtin.debug:
        msg: "{{ demo_greeting }}\n"